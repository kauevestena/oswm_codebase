name: Overpass cached-change replay sandbox
on:
  push:
    branches: [sandbox/overpass-change-queries]
    paths:
      - sandbox/cached_change_replay.py
      - .github/workflows/overpass_cached_replay_sandbox.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: oswm-overpass-change-query-sandbox
  cancel-in-progress: false
jobs:
  replay:
    if: github.repository == 'kauevestena/oswm_codebase' && github.ref == 'refs/heads/sandbox/overpass-change-queries'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        city: [curitiba, milan]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: overpass-changes-${{ matrix.city }}-41343838674
          run-id: 41343838674
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/seed-${{ matrix.city }}
      - name: Verify byte accounting, transaction handling, and immutable geometry inputs
        run: |
          python sandbox/test_source_benchmark.py
          python sandbox/test_change_query_probe.py
      - name: Compare cache plus changes with a fresh independent full snapshot
        run: |
          python sandbox/cached_change_replay.py --city '${{ matrix.city }}' \
            --seed "$RUNNER_TEMP/seed-${{ matrix.city }}" \
            --work "$RUNNER_TEMP/cached-replay-${{ matrix.city }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cached-replay-${{ matrix.city }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cached-replay-${{ matrix.city }}/report.json
            ${{ runner.temp }}/cached-replay-${{ matrix.city }}/source-cache/*.json*
          if-no-files-found: error
          retention-days: 14
      # Read-only seed restore; sandbox artifact upload only. No node publisher.
