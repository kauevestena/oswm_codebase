name: Metropolitan extract sandbox (Curitiba and Milan)

on:
  push:
    branches: [sandbox/metro-extract-curitiba-milan]
    paths:
      - sandbox/metro_extract_probe.py
      - .github/workflows/metro_extract_sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    if: github.repository == 'kauevestena/oswm_codebase' && github.ref == 'refs/heads/sandbox/metro-extract-curitiba-milan'
    strategy:
      fail-fast: false
      matrix:
        city: [curitiba, milan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Replay two daily updates against independent full snapshots
        run: |
          python sandbox/metro_extract_probe.py \
            --cities '${{ matrix.city }}' --buffer-km 25 \
            --dates 261028 261029 261030 \
            --work "$RUNNER_TEMP/metro-extract-${{ matrix.city }}" \
            --report "evidence/${{ matrix.city }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metro-extract-sandbox-${{ matrix.city }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
      # No node workflow, source cache, git push, publication or Pages access.
