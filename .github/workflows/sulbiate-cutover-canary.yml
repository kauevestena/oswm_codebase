name: Milan and Paris read-only cutover canaries

on:
  push:
    branches: ['agent/ohsome-cutover-isolated']

permissions:
  contents: read

concurrency:
  group: sulbiate-cutover-isolated
  cancel-in-progress: true

jobs:
  node:
    name: ${{ matrix.node.city }} isolated daily
    strategy:
      fail-fast: false
      matrix:
        node:
          - city: Milan
            repository: opensidewalkmap/milan
            ref: c8a2055200a918bb1a9b40aad1e4926c5ab7dfa8
          - city: Paris
            repository: opensidewalkmap/paris
            ref: 102299c4611c3d395d3fbe642611036759e3b6d0
    # Isolated experiment; never run this on main or a node checkout with write access.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out pinned test node
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.node.repository }}
          ref: ${{ matrix.node.ref }}
          submodules: false
          persist-credentials: false
      - name: Check out the proposed core revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: oswm_codebase
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: oswm_codebase/requirements.txt
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk gdal-bin libgdal-dev
          python -m pip install -r oswm_codebase/requirements.txt
      - name: Run the daily entry point with live upstreams
        run: |
          set -euxo pipefail
          git -C oswm_codebase rev-parse HEAD
          git rev-parse HEAD
          cp quality_check/completeness/data.json "$RUNNER_TEMP/node-before.json"
          bash oswm_codebase/runners/daily.sh 2>&1 | tee "$RUNNER_TEMP/node-daily.log"
      - name: Validate products, archived observations and cached-road refresh
        run: |
          set -euxo pipefail
          python oswm_codebase/other/auxiliary_scripts/validate_tiles.py
          python oswm_codebase/node_outputs.py --root . require
          python oswm_codebase/node_outputs.py --root . validate-sizes --max-mib 95
          python oswm_codebase/runtime_validation.py --root .
          python oswm_codebase/data_quality/completeness/completeness_runner.py --offline
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def snapshot(data, date):
              return {
                  (zoom, tile_id): row
                  for zoom, layer in data["zoom_levels"].items()
                  for tile_id, tile in layer["tiles"].items()
                  for row in tile["data"] if row["timestamp"] == date
              }

          acquisition = read("data/updates/acquisition.json")
          print("Current source provenance:", json.dumps(acquisition, sort_keys=True))
          assert acquisition["provider"] in {"overpass", "geofabrik_pbf"}
          if acquisition["provider"] == "geofabrik_pbf":
              assert acquisition.get("snapshot_timestamp"), "Missing PBF replication timestamp"
              assert len(acquisition["sha256"]) == 64
              assert acquisition.get("parse_seconds") is not None
          else:
              # OSMnx does not expose an Overpass replication cutoff here.
              assert acquisition.get("acquired_at"), "Missing Overpass retrieval time"
          before = read(Path(os.environ["RUNNER_TEMP"]) / "node-before.json")
          after = read("quality_check/completeness/data.json")
          latest = after["timestamps"][-1]
          assert latest >= before["timestamps"][-1], "Current data is older than archived data"
          assert after["metadata"]["snapshot_sources"][latest] == "local_osm_snapshot"
          assert len(after["zoom_levels"]["17"]["tiles"]) == len(before["zoom_levels"]["17"]["tiles"])
          for date in before["timestamps"]:
              if date < latest:
                  assert snapshot(before, date), f"Archive date lacks rows: {date}"
                  assert snapshot(before, date) == snapshot(after, date), f"Archived rows changed: {date}"
          print("Verified current snapshot:", latest)
          print("Fine-grid tiles:", len(after["zoom_levels"]["17"]["tiles"]))
          PY
      - name: Upload only diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover-diagnostics-${{ matrix.node.city }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/node-daily.log
            data/updates/acquisition.json
            data/updates/pipeline_decision.json
            data/updates/pipeline_failures.txt
