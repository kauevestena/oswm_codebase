name: Fleet rollout

on:
  workflow_run:
    workflows: [core_ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact oswm_codebase main commit; defaults to current main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: oswm-fleet-rollout
  cancel-in-progress: false

jobs:
  reference:
    if: >-
      vars.OSWM_FLEET_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the reference-owner GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OSWM_FLEET_APP_CLIENT_ID }}
          private-key: ${{ secrets.OSWM_FLEET_APP_PRIVATE_KEY }}
          owner: kauevestena
          permission-actions: write
          permission-contents: read
      - name: Roll out and verify the reference wave
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha || github.sha }}
        run: |
          python -m fleet.rollout \
            --registry fleet/registry.toml \
            --owner kauevestena \
            --wave 0 \
            --revision "$REVISION" \
            --wait-seconds 900

  production:
    needs: reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the organization GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OSWM_FLEET_APP_CLIENT_ID }}
          private-key: ${{ secrets.OSWM_FLEET_APP_PRIVATE_KEY }}
          owner: opensidewalkmap
          permission-actions: write
          permission-contents: read
      - name: Roll out and verify the production wave
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha || github.sha }}
        run: |
          python -m fleet.rollout \
            --registry fleet/registry.toml \
            --owner opensidewalkmap \
            --wave 1 \
            --revision "$REVISION" \
            --wait-seconds 900
