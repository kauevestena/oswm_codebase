name: deploy_pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "map.html"
      - "webmap_params.json"
      - "data/**"
      - "metadata/**"
      - "hub/**"
      - "quality_check/**"
      - "statistics/**"
      - "statistics_specs/**"
      - "assets/**"
      - "oswm_runtime/**"
      - "oswm-build.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: oswm-pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: kauevestena/oswm_codebase/.github/workflows/node_pages.yml@main
