schema_version = 1

[policy]
# GitHub-hosted scheduled runs can start several hours late. Surface the lag as
# degraded after three hours, but reserve a failing stale status for a missed
# seven-hour SLA. In-progress and queued runs remain "updating".
schedule_warning_minutes = 180
schedule_grace_minutes = 420
workflow_history = 100
api_timeout_seconds = 20
page_timeout_seconds = 20

[[nodes]]
id = "curitiba"
repository = "kauevestena/opensidewalkmap_beta"
branch = "main"
role = "reference"
enabled = true
rollout_wave = 0
pages_url = "https://kauevestena.github.io/opensidewalkmap_beta/"

