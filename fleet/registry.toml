schema_version = 1

[policy]
# Keep the three-hour warning. November 2026 scheduled jobs took up to 12h22m
# to complete after cron. Round up to 13 hours to allow that observed delay
# while still detecting a missing run within its daily cycle.
schedule_warning_minutes = 180
schedule_grace_minutes = 780
workflow_history = 100
api_timeout_seconds = 20
page_timeout_seconds = 20

[[nodes]]
id = "curitiba"
repository = "kauevestena/opensidewalkmap_beta"
branch = "main"
role = "reference"
enabled = true
rollout_wave = 0
pages_url = "https://kauevestena.github.io/opensidewalkmap_beta/"

